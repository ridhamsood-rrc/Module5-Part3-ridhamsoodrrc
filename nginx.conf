worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Label each request with the service it was sent to, so the logs show the routing.
    map $uri $service {
        ~^/api/transactions   transactions;
        ~^/api/               backend;
        default               frontend;
    }

    log_format routed '$remote_addr [$time_local] "$request" $status '
                      '-> $service ($upstream_addr)';
    access_log /var/log/nginx/access.log routed;

    # Containers, reached by their Docker Compose service names.
    upstream transactions_service {
        server transactions:3000;          # JavaScript (Node + Express) microservice
    }

    upstream backend_service {
        server backend:5000;               # Python (Flask) banking API
    }

    upstream frontend_service {
        server frontend:80;                # static student portfolio
    }

    server {
        listen 80;
        server_name localhost;

        # 1. Transactions microservice entry point (JavaScript).
        #    /api/transactions          -> monthly report for the logged-in user
        #    /api/transactions/<userId> -> transactions grouped by month for one user
        #    It is the longest matching prefix, so it wins over /api/ below.
        location /api/transactions {
            proxy_pass http://transactions_service;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Banking API (Python/Flask): login, register, dashboard,
        #    deposit, withdraw and logout.
        location /api/ {
            proxy_pass http://backend_service;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Everything else: the student portfolio.
        location / {
            proxy_pass http://frontend_service;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Branded page if a service is down or still starting.
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
