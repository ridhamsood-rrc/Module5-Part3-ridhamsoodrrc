version: "3.8"

services:

  # 1. Database: shared by the Python backend and the JavaScript transactions service.
  mongo:
    image: mongo:6
    restart: always
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 2. Banking API (Python + Flask).
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/bank_app
      - SECRET_KEY=supersecretkey
    depends_on:
      mongo:
        condition: service_healthy

  # 3. Transactions microservice (JavaScript: Node + Express).
  transactions:
    build:
      context: ./transactions
      dockerfile: Dockerfile
    restart: on-failure
    expose:
      - "3000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - DB_NAME=bank_app
      - PORT=3000
      - SECRET_KEY=supersecretkey
    depends_on:
      mongo:
        condition: service_healthy

  # 4. Front-end: the student portfolio (static HTML).
  frontend:
    build:
      context: ./studentportfolio
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - backend
      - transactions

  # 5. Reverse proxy: the only service published to the host.
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/50x.html:/usr/share/nginx/html/50x.html:ro
    depends_on:
      - backend
      - transactions
      - frontend

volumes:
  mongo_data:
